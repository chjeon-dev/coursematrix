document.querySelectorAll('.qx-sw').forEach(e=>{e.style.background=qc(e.dataset.q)});
dash.calc('quadrant_counts',{inputs:['courses'],title:'사분면별 과정 수',description:'과정 목록을 사분면 코드별로 세고 전체 대비 비중을 구합니다.',
  fn:(courses)=>['RT','RB','LT','LB'].map(q=>{const n=courses.filter(c=>c.quadrant===q).length;const r=courses.find(c=>c.quadrant===q);return {quadrant:q,quadrant_name:r?r.quadrant_name:q,n,share:courses.length?n/courses.length:0}})});
dash.calc('category_quadrants',{inputs:['courses'],title:'카테고리별 사분면 분포',description:'카테고리마다 사분면별 과정 수와 합계를 셉니다.',
  fn:(courses)=>{const m=new Map();courses.forEach(c=>{if(!m.has(c.category))m.set(c.category,{category:c.category,total:0,RT:0,RB:0,LT:0,LB:0});const o=m.get(c.category);o.total++;o[c.quadrant]++});return [...m.values()].sort((a,b)=>(b.RT/b.total)-(a.RT/a.total))}});
const G=16;let pinned=null,hover=null;
const fmt=d3.format(','),pct=d3.format('.0%');
const lg=document.getElementById('lg');
QS.forEach(q=>{const s=document.createElement('span');const i=document.createElement('i');i.className='qx-sw';i.style.background=qc(q);s.append(i,QN[q]);lg.append(s)});
function cellOf(c){const x=Math.min(G-1,Math.floor(+c.x*G)),y=Math.min(G-1,Math.floor(+c.y*G));return x+'_'+y}
function renderList(rows,label){
  const term=document.getElementById('q').value.trim().toLowerCase();
  const list=term?rows.filter(r=>r.title.toLowerCase().includes(term)):rows;
  document.getElementById('pn').textContent=label;
  document.getElementById('pc').textContent=fmt(list.length)+'개'+(pinned?' · 고정됨 (다시 클릭하면 해제)':'');
  const ul=document.getElementById('pl');ul.textContent='';
  if(!list.length){const li=document.createElement('li');li.className='qx-empty';li.textContent='해당하는 과정이 없습니다';ul.append(li);return}
  list.slice().sort((a,b)=>a.title.localeCompare(b.title,'ko')).forEach(r=>{const li=document.createElement('li');li.append(r.title);const s=document.createElement('span');s.className='qx-cat';s.textContent=r.category+' · '+r.quadrant_name;li.append(s);ul.append(li)});
}
function draw(){
  const D=dash.data('courses'),mx=document.getElementById('mx');
  const qcD=dash.data('quadrant_counts'),cq=dash.data('category_quadrants');
  if(qcD.status==='ok'){
    const t=qcD.data;
    document.querySelectorAll('[data-source=quadrant_counts][data-field]').forEach(e=>{e.classList.remove('dash-skeleton');const q=e.dataset.where.split('=')[1];const r=t.find(d=>d.quadrant===q);e.textContent=r?(e.dataset.field==='n'?fmt(r.n):'전체의 '+pct(r.share)):'—'});
  }
  const cb=document.getElementById('cb');
  if(cq.status==='ok'){cb.classList.remove('dash-skeleton');cb.textContent='';
    cq.data.forEach(r=>{const row=document.createElement('div');row.className='qx-row';const n=document.createElement('span');n.textContent=r.category;const bar=document.createElement('div');bar.className='qx-bar';
      QS.forEach(q=>{if(!r[q])return;const s=document.createElement('div');s.style.width=(r[q]/r.total*100)+'%';s.style.background=qc(q);bar.append(s)});
      const c=document.createElement('span');c.className='qx-n';c.textContent=fmt(r.total);row.append(n,bar,c);cb.append(row)})}
  if(D.status!=='ok'){mx.textContent='';if(D.status==='error'){mx.classList.remove('dash-skeleton');mx.style.cssText='display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)';const dot=document.createElement('i');dot.style.cssText='width:.375rem;height:.375rem;border-radius:50%;background:var(--color-bad)';mx.append(dot,'Failed to load')}return}
  mx.classList.remove('dash-skeleton');mx.style.cssText='';
  const rows=D.data,cells=d3.group(rows,cellOf);
  const term=document.getElementById('q').value.trim().toLowerCase();
  const W=560,H=460,L=64,T=14,PW=W-L-10,PH=H-T-56,cw=PW/G,ch=PH/G;
  mx.textContent='';
  const svg=d3.select(mx).append('svg').attr('width','100%').attr('viewBox',`0 0 ${W} ${H}`).attr('role','img').attr('aria-label','디지털-AI와 난이도 4사분면 매트릭스');
  svg.append('rect').attr('x',L).attr('y',T).attr('width',PW).attr('height',PH).attr('rx',4).attr('fill','none').attr('stroke','var(--cds-chart-axis)');
  svg.append('line').attr('x1',L+PW/2).attr('x2',L+PW/2).attr('y1',T).attr('y2',T+PH).attr('stroke','var(--cds-chart-reference)').attr('stroke-dasharray','4 4');
  svg.append('line').attr('x1',L).attr('x2',L+PW).attr('y1',T+PH/2).attr('y2',T+PH/2).attr('stroke','var(--cds-chart-reference)').attr('stroke-dasharray','4 4');
  const ql={LT:[L+10,T+20,'start'],RT:[L+PW-10,T+20,'end'],LB:[L+10,T+PH-12,'start'],RB:[L+PW-10,T+PH-12,'end']};
  QS.forEach(q=>{const[x,y,a]=ql[q];svg.append('text').attr('x',x).attr('y',y).attr('text-anchor',a).attr('font-size',12).attr('fill','var(--color-fg-muted)').text(QN[q])});
  const ax=(x,y,a,t,w)=>svg.append('text').attr('x',x).attr('y',y).attr('text-anchor',a).attr('font-size',12).attr('font-weight',w||null).attr('fill','var(--color-fg-muted)').text(t);
  ax(L,T+PH+18,'start','디지털 도구 중심');ax(L+PW/2,T+PH+18,'middle','AI 결합 활용');ax(L+PW,T+PH+18,'end','AI 구축·개발');ax(L+PW/2,T+PH+40,'middle','디지털 → AI',500);
  [[T+6,'고급·구축'],[T+PH/2,'실무 활용'],[T+PH-2,'입문·기초']].forEach(([y,t])=>svg.append('text').attr('x',L-8).attr('y',y).attr('text-anchor','end').attr('dominant-baseline','middle').attr('font-size',12).attr('fill','var(--color-fg-muted)').text(t));
  svg.append('text').attr('transform',`translate(14,${T+PH/2}) rotate(-90)`).attr('text-anchor','middle').attr('font-size',12).attr('font-weight',500).attr('fill','var(--color-fg-muted)').text('난이도');
  const data=[...cells].map(([k,v])=>{const[i,j]=k.split('_').map(Number);return{k,i,j,v,q:(i>=G/2?'R':'L')+(j>=G/2?'T':'B'),hit:term?v.filter(r=>r.title.toLowerCase().includes(term)).length:v.length}});
  const g=svg.append('g');
  g.selectAll('circle').data(data).join('circle')
    .attr('cx',d=>L+(d.i+.5)*cw).attr('cy',d=>T+PH-(d.j+.5)*ch)
    .attr('r',d=>Math.min(cw*.62,2.4+Math.sqrt(d.v.length)*1.9))
    .attr('fill',d=>qc(d.q)).attr('fill-opacity',d=>d.hit?.8:.12)
    .attr('stroke',d=>(pinned===d.k)?'var(--color-fg)':'var(--color-panel)').attr('stroke-width',d=>pinned===d.k?2:1)
    .style('cursor','pointer')
    .on('mouseenter',(e,d)=>{if(pinned)return;hover=d.k;renderList(d.v,QN[d.q]+' 구간')})
    .on('mouseleave',()=>{if(pinned)return;hover=null;renderList(rows,'전체 과정')})
    .on('click',(e,d)=>{pinned=pinned===d.k?null:d.k;draw()});
  const cur=pinned&&cells.get(pinned);
  if(cur){const[i,j]=pinned.split('_').map(Number);renderList(cur,QN[(i>=G/2?'R':'L')+(j>=G/2?'T':'B')]+' 구간')}
  else if(hover&&cells.get(hover)){const[i,j]=hover.split('_').map(Number);renderList(cells.get(hover),QN[(i>=G/2?'R':'L')+(j>=G/2?'T':'B')]+' 구간')}
  else renderList(rows,term?'검색 결과':'전체 과정');
}
document.getElementById('q').addEventListener('input',()=>{pinned=null;draw()});
dash.onData(draw);
</script>

</div></body></html>
